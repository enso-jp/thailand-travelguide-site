name: Publish site

on:
  schedule:
  # 00:15 UTC is 07:15 in Asia/Bangkok. GitHub may start the run later.
  - cron: '15 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage publication
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('.')
          dest = Path('_site')
          skip = {'.git', '.github', 'source', '_site', 'README.md', '.gitignore'}
          for item in root.iterdir():
              if item.name in skip:
                  continue
              target = dest / item.name
              if item.is_dir():
                  shutil.copytree(item, target, symlinks=True)
              else:
                  shutil.copy2(item, target)
          required = [
              dest / 'index.html',
              dest / '.nojekyll',
              dest / 'CNAME',
              dest / 'favicon.ico',
              dest / 'favicon.svg',
              dest / 'favicon-48x48.png',
              dest / 'about' / 'ratings' / 'index.html',
              dest / 'sitemap.xml',
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit('missing publication files: ' + ', '.join(missing))
          if (dest / 'README.md').exists():
              raise SystemExit('publication stage must not include README.md')
          cname = (dest / 'CNAME').read_text(encoding='utf-8').strip()
          if cname != 'thailand-travelguide.com':
              raise SystemExit(f'unexpected CNAME: {cname!r}')
          print('staged publication ok')
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
